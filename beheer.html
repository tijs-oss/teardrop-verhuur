<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beschikbaarheid beheren — Kulba Rebel</title>
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{
  font-family:'InterVar';
  src:url('fonts/inter.woff2') format('woff2-variations'),
      url('fonts/inter.woff2') format('woff2');
  font-weight:100 900; font-style:normal; font-display:swap;
}
:root{
  --ink:#111113; --paper:#fff; --paper-2:#f5f5f7; --muted:#6e6e73;
  --line:rgba(0,0,0,.10); --accent:#E2600F; --accent-soft:#FFF1E6;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper-2); color:var(--ink);
  font-family:'InterVar','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}

/* ---------- slotscherm ---------- */
#slot{position:fixed; inset:0; z-index:9999; background:var(--ink);
  display:grid; place-items:center; padding:22px}
#slot .doos{width:100%; max-width:390px; text-align:left}
#slot .kicker{font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin:0 0 12px}
#slot h1{margin:0 0 10px; font-size:34px; font-weight:900; letter-spacing:-.04em; line-height:1.05;
  color:#fff; text-wrap:balance}
#slot p{margin:0 0 26px; color:rgba(255,255,255,.55); font-size:15px}
#slot label{display:block; font-size:13px; font-weight:650; color:rgba(255,255,255,.75); margin-bottom:7px}
#slot input{width:100%; font-family:inherit; font-size:16px; padding:14px 16px; border-radius:13px;
  border:1.5px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); color:#fff}
#slot input::placeholder{color:rgba(255,255,255,.3)}
#slot input:focus{outline:none; border-color:var(--accent); background:rgba(255,255,255,.11)}
#slot button{width:100%; margin-top:14px; border:0; cursor:pointer; font-family:inherit; font-size:16px;
  font-weight:650; padding:14px 24px; border-radius:999px; background:var(--accent); color:#fff;
  transition:background .15s, transform .15s}
#slot button:hover:not(:disabled){background:#c9530b}
#slot button:active{transform:scale(.98)}
#slot button:disabled{background:#3a3a3e; color:rgba(255,255,255,.4); cursor:progress}
#slot .fout{margin:16px 0 0; color:#FF9E7A; font-size:14px; font-weight:600; min-height:1.3em}
#slot .kleintje{margin:26px 0 0; font-size:12.5px; color:rgba(255,255,255,.35); line-height:1.55}
#app{display:none}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms !important} }
</style>
</head>
<body>

<div id="slot">
  <div class="doos">
    <p class="kicker">Rebel·verhuur</p>
    <h1>Beheer is vergrendeld</h1>
    <p>Deze pagina is versleuteld. Zonder wachtwoord valt er niets uit te lezen — ook niet uit de broncode.</p>
    <form id="slotform">
      <label for="pw">Wachtwoord</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus="" placeholder="••••••••••">
      <button type="submit" id="knop">Ontgrendelen</button>
    </form>
    <p class="fout" id="fout"></p>
    <p class="kleintje">Wachtwoord vergeten? Er is geen herstel — de gegevens zitten in de sleutel. Bouw dan een nieuwe beheerpagina.</p>
  </div>
</div>

<div id="app"></div>

<script src="beschikbaarheid.js"></script>

let KERN = null;

const b2b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bin2b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function sleutelUit(wachtwoord, salt, iteraties){
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(wachtwoord),
                                              'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:iteraties, hash:'SHA-256' },
    basis, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}

async function ontgrendel(wachtwoord){
  const sleutel = await sleutelUit(wachtwoord, b2b(KLUIS.salt), KLUIS.iter);
  const platte = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2b(KLUIS.iv) },
                                             sleutel, b2b(KLUIS.ct));
  return JSON.parse(new TextDecoder().decode(platte));
}

/* Versleutelt de kern opnieuw met een nieuw wachtwoord en levert een compleet
   nieuw beheer.html — zo kan je het wachtwoord wijzigen zonder mij.          */
async function herbouw(kern, nieuwWachtwoord){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const sleutel = await sleutelUit(nieuwWachtwoord, salt, KLUIS.iter);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, sleutel,
                                         new TextEncoder().encode(JSON.stringify(kern)));
  const nieuweKluis = JSON.stringify({ salt:bin2b64(salt), iv:bin2b64(iv),
                                       ct:bin2b64(ct), iter:KLUIS.iter });
  return SCHIL_HTML.replace(/const KLUIS = \{[\s\S]*?\};/, () => 'const KLUIS = ' + nieuweKluis + ';');
}

function bewaarAls(html, naam){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type:'text/html' }));
  a.download = naam;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function activeerBeheer(kern){
  KERN = kern;
  window.__GIT  = kern.git  || {};
  window.__MAIL = kern.mail || {};

  /* De beheerpagina roept dit aan om instellingen (repo, token, betaalgegevens)
     mee te versleutelen in een nieuwe beheer.html.                            */
  window.beheerVastleggen = async function(instellingen){
    if (instellingen.git)  KERN.git  = instellingen.git;
    if (instellingen.mail) KERN.mail = instellingen.mail;
    bewaarAls(await herbouw(KERN, HUIDIG_PW), 'beheer.html');
  };

  const st = document.createElement('style');
  st.id = 'beheerstijl'; st.textContent = kern.css;
  document.head.appendChild(st);
  const app = document.getElementById('app');
  app.innerHTML = kern.html;
  app.style.display = 'block';
  document.getElementById('slot').remove();

  const sc = document.createElement('script');
  sc.textContent = kern.js;
  document.body.appendChild(sc);

  // knop om het wachtwoord te wijzigen, in de publiceerkaart
  const doel = document.getElementById('pw-knop');
  if (doel){
    const rij = document.createElement('div');
    rij.className = 'btnrow';
    rij.innerHTML = '<button class="btn btn-ghost" id="pwwijzig" type="button">Wachtwoord wijzigen</button>';
    doel.appendChild(rij);
    document.getElementById('pwwijzig').onclick = async () => {
      const n1 = prompt('Nieuw wachtwoord (minstens 10 tekens):');
      if (!n1) return;
      if (n1.length < 10){ alert('Te kort. Kies minstens 10 tekens.'); return; }
      if (prompt('Typ het nog eens ter controle:') !== n1){ alert('De twee ingaves komen niet overeen. Er is niets gewijzigd.'); return; }
      bewaarAls(await herbouw(KERN, n1), 'beheer.html');
      HUIDIG_PW = n1;
      alert('Er is een nieuwe beheer.html gedownload.\\n\\nVervang je huidige beheer.html door dit bestand. Vanaf dan geldt het nieuwe wachtwoord.');
    };
  }
}

document.getElementById('slotform').addEventListener('submit', async e => {
  e.preventDefault();
  const knop = document.getElementById('knop');
  const fout = document.getElementById('fout');
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  fout.textContent = '';
  knop.disabled = true; knop.textContent = 'Ontgrendelen…';
  await new Promise(r => setTimeout(r, 30));
  try {
    const kern = await ontgrendel(pw);
    HUIDIG_PW = pw;
    activeerBeheer(kern);
  } catch (err) {
    fout.textContent = 'Verkeerd wachtwoord.';
    knop.disabled = false; knop.textContent = 'Ontgrendelen';
    document.getElementById('pw').select();
  }
});
